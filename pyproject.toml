[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hcl*"]

[project]
name = "hcl"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "critdd",
    "datasets>=5.0.0",
    "figure-scale>=0.1.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "optuna>=5.0.0",
    "pandas>=3.0.3",
    "pandas-stubs>=3.0.3.260530",
    "pre-commit>=4.6.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pyrefly>=0.60.0",
    "ruff>=0.15.20",
    "scienceplots>=2.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "scipy-stubs>=1.18.0.0",
    "seaborn>=0.13.2",
    "sentence-transformers==5.1.2",
    "shapely>=2.1.2",
    "tqdm>=4.68.3",
    "ty>=0.0.56",
    "umap-learn>=0.5.12",
]

[project.scripts]
generate-embeddings = "hcl.scripts.generate_embeddings:main"
submit-embedding-jobs = "hcl.scripts.submit_embedding_jobs:main"
run-all-experiments = "hcl.scripts.run_all:run_all_experiments"
run-all-plots = "hcl.scripts.run_all:run_all_plots"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.7",
    "ty>=0.0.29",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["hcl/baselines/**", "notebooks/**"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long – handled by formatter
    "N803",  # argument name should be lowercase – waived for mathematical notation (X, W, N, R, …)
    "N806",  # variable in function should be lowercase – waived for mathematical notation
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
exclude = ["hcl/baselines/**", "notebooks/**", "hcl/experiments/**"]

[tool.uv.sources]
critdd = { git = "https://github.com/mirkobunse/critdd" }
