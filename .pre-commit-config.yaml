repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.10
  hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi, pyproject ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]
- repo: local
  hooks:
    - id: ty-check
      name: ty check
      entry: env UV_PROJECT_ENVIRONMENT=.venv uv run --project . ty check --force-exclude --exclude "experiments/" --exclude "notebooks/" --exclude "vmf_spectral/baselines/"
      language: system
      require_serial: true
      types_or: [ python, pyi ]
